# Builds the site and publishes it to GitHub Pages on every push to main.
# The build converts data/*.csv to JSON first, so editing a CSV and pushing
# updates the live site.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
#
# Preview: if a Different-scroll branch exists, it's built too and published at
# /different-scroll/ (hidden from search engines). Pushing to that branch re-runs this
# deploy (its preview.yml). Delete the branch, or this step, to take the preview down.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (CSV → JSON, then Vite)
        run: npm run build
        env:
          # The site is served from the root of its own subdomain
          # (thrivingstreets.oxfordshireliveablestreets.com, set in Settings → Pages).
          BASE_PATH: /

      - name: Build the Different-scroll preview (at /different-scroll/), if the branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin Different-scroll > /dev/null; then
            echo "No Different-scroll branch: no preview."
            exit 0
          fi
          git fetch --depth 1 origin Different-scroll
          git worktree add "$RUNNER_TEMP/preview" FETCH_HEAD
          cd "$RUNNER_TEMP/preview"
          npm ci
          BASE_PATH=/different-scroll/ npm run build
          # Keep the preview out of search results.
          find dist -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex" />|' {} +
          cp -r dist "$GITHUB_WORKSPACE/dist/different-scroll"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
